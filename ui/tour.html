<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eZNotes Tour</title>
    <link rel="stylesheet" href="../css/tour.css">
</head>

<body>
    <div class="slideshow-container" id="slideshow">

    </div>

    <div id="virtual-cursor" style="position: absolute; width: 24px; height: 24px; z-index: 3000; transition: left 0.6s cubic-bezier(0.2, 0, 0, 1), top 0.6s cubic-bezier(0.2, 0, 0, 1); opacity: 0; pointer-events: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));">
        <svg viewBox="0 0 24 24" width="28" height="28" style="transform: rotate(-15deg);">
            <path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.87a.5.5 0 0 0 .35-.85L5.5 3.21z" fill="white" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <div id="cursor-ripple" style="position: absolute; top: -5px; left: -5px; width: 20px; height: 20px; border: 2px solid var(--primary); border-radius: 50%; opacity: 0; transform: scale(1); pointer-events: none; transition: all 0.3s ease-out;"></div>
    </div>

    <div class="nav-bar">
        <div class="nav-left">
            <img id="tourLogo" src="" class="logo-img" style="display: none;">
        </div>
        <div class="nav-center">
            <div class="progress-container" id="progressContainer"></div>
        </div>
        <div class="nav-right">
            <button id="btnPrev" class="nav-btn" title="Zurück (Pfeil Links)">❮</button>
            <button id="btnNext" class="nav-btn" title="Weiter (Pfeil Rechts / Leertaste)">❯</button>
        </div>
    </div>

    <script src="../js/image_store.js"></script>
    <script src="../js/tour.js"></script>
</body>

</html>
