<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <title>eZClip - Text & Data Transformer</title>
  <link rel="icon" href="../icons/SuiteIcon.png" type="image/png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --accent: #eff6ff;
      --hover-bg: #f1f5f9;
      --border-color: #e2e8f0;
      --input-bg: #ffffff;
      --radius: 12px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 40%, #f1f5f9 100%);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand img {
      height: 34px;
      width: auto;
      object-fit: contain;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 700;
      color: #6366f1;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      padding: 3px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      padding: 20px 28px;
      gap: 20px;
    }

    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .history-sidebar {
      width: 340px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .history-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fafafa;
    }

    .history-header h3 {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item:hover {
      border-color: #6366f1;
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    .history-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item-time {
      font-size: 10px;
      color: var(--text-muted);
    }

    .history-item-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-main);
      white-space: pre;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 38px;
      line-height: 1.3;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .tools-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
    }

    .action-btn {
      padding: 9px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .action-btn:hover {
      background: #eff6ff;
      border-color: #6366f1;
      color: #4f46e5;
      transform: translateY(-1px);
    }

    .action-btn .icon {
      font-size: 14px;
    }

    .editor-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 10px;
      min-height: 240px;
    }

    .editor-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    textarea#mainInput {
      flex: 1;
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      padding: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--text-main);
      background: #fafafa;
      outline: none;
      resize: none;
      transition: border-color 0.2s, background 0.2s;
    }

    textarea#mainInput:focus {
      background: #ffffff;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    button.btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    button.btn:hover {
      background: var(--hover-bg);
      border-color: #94a3b8;
    }

    button.btn-primary {
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
    }

    button.btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(79, 70, 229, 0.35);
    }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 28px;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 1000;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
</style>
</head>

<body>

  <header>
    <div class="brand">
      <img src="../assets/clip_logo.png" alt="eZClip Logo">
      <span class="brand-tag">Text & Data Transformer</span>
    </div>
    <div class="header-actions">
      <button id="btnPaste" class="btn" title="Aus Zwischenablage einfügen">
        📋 Zwischenablage einfügen
      </button>
      <button id="btnClear" class="btn" title="Editor leeren">
        🗑️ Leeren
      </button>
      <button id="btnCopyResult" class="btn btn-primary" title="In Zwischenablage kopieren & merken">
        ✨ Kopieren & Sichern
      </button>
    </div>
  </header>

  <div class="app-body">

    <div class="workspace">

      <div class="card editor-card">
        <div class="editor-toolbar">
          <div class="section-title" style="margin-bottom: 0;">EINGABE- & BEARBEITUNGSFELD</div>
          <small id="textStats" style="color: var(--text-muted); font-size: 11px; font-weight: 500;">
            0 Zeichen • 0 Wörter • 0 Zeilen
          </small>
        </div>
        <textarea id="mainInput" placeholder="Füge deinen Text oder Datensatz hier ein, oder nutze den Button 'Zwischenablage einfügen' oben..."></textarea>
      </div>

      <div class="card tools-card">
        <div>
          <div class="section-title">CLEAN & CONVERT</div>
          <div class="btn-grid">
            <button class="action-btn" id="act-strip" title="Entfernt überflüssige Leerzeilen, Tabs und Whitespaces">
              <span class="icon">🧹</span>
              <span>Clean / Trim</span>
            </button>
            <button class="action-btn" id="act-upper" title="ALLES IN GROSSBUCHSTABEN">
              <span class="icon">🔠</span>
              <span>UPPERCASE</span>
            </button>
            <button class="action-btn" id="act-lower" title="alles in kleinbuchstaben">
              <span class="icon">🔡</span>
              <span>lowercase</span>
            </button>
            <button class="action-btn" id="act-title" title="Jedes Wort Gross">
              <span class="icon">📰</span>
              <span>Title Case</span>
            </button>
            <button class="action-btn" id="act-camel" title="camelCaseFormat">
              <span class="icon">🐪</span>
              <span>camelCase</span>
            </button>
            <button class="action-btn" id="act-snake" title="snake_case_format">
              <span class="icon">🐍</span>
              <span>snake_case</span>
            </button>
            <button class="action-btn" id="act-kebab" title="kebab-case-format">
              <span class="icon">🍢</span>
              <span>kebab-case</span>
            </button>
          </div>
        </div>

        <div>
          <div class="section-title">DEVELOPER, DATA & LIST TOOLS</div>
          <div class="btn-grid">
            <button class="action-btn" id="act-json" title="JSON einrücken (Pretty Print) oder Minify">
              <span class="icon">⚡</span>
              <span>JSON Formatter</span>
            </button>
            <button class="action-btn" id="act-url" title="URL En- bzw. Dekodieren">
              <span class="icon">🌐</span>
              <span>URL En/Decode</span>
            </button>
            <button class="action-btn" id="act-base64" title="Base64 En- bzw. Dekodieren">
              <span class="icon">🔒</span>
              <span>Base64</span>
            </button>
            <button class="action-btn" id="act-sql" title="Zeilen in 'val1', 'val2' für SQL IN (...) transformieren">
              <span class="icon">🗄️</span>
              <span>SQL Quoter</span>
            </button>
            <button class="action-btn" id="act-sort" title="Zeilen sortieren (A-Z) und Duplikate filtern">
              <span class="icon">🔀</span>
              <span>Sort & Unique</span>
            </button>
            <button class="action-btn" id="act-bullet" title="Als Markdown-Bulletpoints formatieren">
              <span class="icon">📝</span>
              <span>Bullet List</span>
            </button>
            <button class="action-btn" id="act-csv" title="Semikolon / Tabulator zu Komma konvertieren">
              <span class="icon">📊</span>
              <span>CSV Normalizer</span>
            </button>
          </div>
        </div>
      </div>

    </div>

    <div class="history-sidebar">
      <div class="history-header">
        <h3>📋 Verlauf (Letzte Clips)</h3>
        <button id="btnClearHistory" class="btn" style="padding: 4px 8px; font-size: 11px;" title="Verlauf leeren">
          Leeren
        </button>
      </div>
      <div id="historyList" class="history-list">
        <div style="text-align: center; color: var(--text-muted); font-size: 11px; padding: 30px 10px;">
          Noch keine Clips vorhanden
        </div>
      </div>
    </div>

  </div>

  <div id="toast">✨ Aktion ausgeführt</div>

  <script src="../js/clip.js"></script>
</body>

</html>
